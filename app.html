<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1ff" />
    <title>파크톡 앱 미리보기</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #292543;
        background: radial-gradient(circle at 15% 15%, #eae5ff, transparent 30%),
          radial-gradient(circle at 85% 80%, #dff5ee, transparent 30%), #f8f7fc;
      }
      .preview {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(32px, 6vw, 100px);
        padding: 32px;
      }
      .intro { width: min(340px, 30vw); }
      .intro__mark {
        display: inline-grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: #6e54cf;
        color: white;
        font-size: 24px;
      }
      .intro h1 { margin: 20px 0 10px; font-size: 36px; letter-spacing: -.06em; }
      .intro p { margin: 0; color: #706d85; line-height: 1.7; }
      .intro__hint { display: block; margin-top: 24px; font-size: 13px; color: #867fb5; }
      .phone {
        position: relative;
        flex: none;
        width: 414px;
        height: min(900px, calc(100dvh - 64px));
        min-height: 560px;
        padding: 11px;
        overflow: hidden;
        border: 4px solid #25223a;
        border-radius: 44px;
        background: #25223a;
        box-shadow: 0 30px 85px #30254d35, 0 4px 12px #30254d1c;
      }
      .phone::before {
        position: absolute;
        z-index: 2;
        top: 17px;
        left: 50%;
        width: 74px;
        height: 18px;
        transform: translateX(-50%);
        border-radius: 0 0 13px 13px;
        background: #25223a;
        content: "";
        pointer-events: none;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 29px;
        background: white;
      }
      @media (max-width: 760px) {
        .preview { display: block; min-height: 100dvh; padding: 0; }
        .intro { display: none; }
        .phone {
          width: 100%;
          height: 100dvh;
          min-height: 0;
          padding: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .phone::before { display: none; }
        iframe { border-radius: 0; }
      }
    </style>
  </head>
  <body>
    <main class="preview">
      <div class="intro">
        <span class="intro__mark">✦</span>
        <h1>ParkTalk</h1>
        <p>휴대폰 화면으로 파크톡을 체험해 보세요. 방문객과 캐스트 모드를 모두 선택할 수 있습니다.</p>
        <span class="intro__hint">이 화면은 앱 형태를 확인하기 위한 시연입니다.</span>
      </div>
      <div class="phone">
        <iframe src="./index.html" title="파크톡 모바일 웹앱" allow="geolocation; clipboard-write"></iframe>
      </div>
    </main>
  </body>
</html>
