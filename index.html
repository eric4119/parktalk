<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffd550" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="파크톡" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/parktalk-logo-transparent.png" />
    <title>ParkTalk | 오늘도 함께, 파크톡</title>
    <meta name="description" content="방문객 일행 찾기와 캐스트 커뮤니티를 연결하는 파크톡 시연 웹앱" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="visitor.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="cast-features.css" />
    <link rel="stylesheet" href="fresh-ui.css" />
    <link rel="stylesheet" href="pets.css" />
  </head>
  <body>
    <section id="authApp" class="auth-app" hidden></section>
    <div class="app" hidden>
      <aside class="sidebar">
        <a class="brand" href="#home" data-nav="home" aria-label="파크톡 홈으로 이동"
          ><img class="brand-logo" src="assets/parktalk-logo-transparent.png" alt="ParkTalk 파크톡 로고" /><small>캐스트를 위한 이야기 공간</small></a
        >
        <nav id="nav"></nav>
        <div class="side-bottom">
          <div class="mini-avatar">캐</div>
          <div><strong>신입 캐스트</strong><small>시연 계정</small></div>
          <button id="settingsBtn" title="앱 설정" aria-label="앱 설정 열기"><svg class="ui-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2h6l.7 3.3 2.2.9 2.8-1.8 4.2 4.2-1.8 2.8.9 2.2 3.3.7v6l-3.3.7-.9 2.2 1.8 2.8-4.2 4.2-2.8-1.8-2.2.9-.7 3.3h-6l-.7-3.3-2.2-.9-2.8 1.8-4.2-4.2 1.8-2.8-.9-2.2L.7 19v-6l3.3-.7.9-2.2-1.8-2.8 4.2-4.2 2.8 1.8 2.2-.9z"/><circle cx="16" cy="16" r="5"/></svg></button>
        </div>
      </aside>
      <div class="main-wrap">
        <header class="topbar">
          <a class="topbar-brand" href="#home" data-nav="home" aria-label="파크톡 홈">
            <svg class="topbar-brand-icon ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2.3"/></svg>
            <span class="topbar-brand-name">파크톡</span>
          </a>
          <div class="search-wrap">
            <span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span
            ><input
              id="search"
              placeholder="궁금한 이야기를 검색해요"
              aria-label="게시글 검색"
            />
          </div>
          <div class="top-actions">
            <button class="icon-btn mobile-search-btn" id="searchToggleBtn" title="검색" aria-label="검색 열기">
              <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            </button>
            <button class="icon-btn" id="messagesBtn" title="쪽지" aria-label="쪽지 보기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path stroke-width="2.1" d="M20.8 11.9c0 4.8-3.9 8.7-8.7 8.7-1.4 0-2.8-.3-4-.9L3.6 21l1.3-4.5A8.7 8.7 0 1 1 20.8 11.9Z" />
                <circle cx="8" cy="12" r="1.15" fill="currentColor" stroke="none" />
                <circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none" />
                <circle cx="16" cy="12" r="1.15" fill="currentColor" stroke="none" />
              </svg>
            </button>
            <button
              class="icon-btn"
              id="noticesBtn"
              title="알림"
              aria-label="알림 보기"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z" />
                <path d="M10 21h4" />
              </svg>
            </button>
            <span class="top-avatar">캐</span
            ><span class="top-name">신입 캐스트</span
            ><span class="demo-chip">체험 모드</span>
            <button class="mobile-menu" id="menuBtn" aria-label="메뉴 열기">
              <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
          </div>
        </header>
        <main id="view"></main>
        <nav id="castBottomNav" class="cast-bottom-nav" aria-label="캐스트 하단 메뉴"></nav>
      </div>
    </div>
    <div id="visitorApp" hidden></div>
    <button class="cast-mode-switch" data-auth-action="switch" id="castModeSwitch" aria-label="모드 전환" hidden>
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8A6.5 6.5 0 0 0 7 8"/><path d="M5 6l2 2-2 2"/><path d="M7 16A6.5 6.5 0 0 0 17 16"/><path d="M19 14l-2 2 2 2"/></svg>
    </button>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal">
      <button class="close" type="button" aria-label="닫기">×</button>
      <div id="modalBody"></div>
    </dialog>
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=etulq1vw33"></script>
    <script src="https://oapi.map.naver.com/openapi/v3/maps-geocoder.js?ncpKeyId=etulq1vw33"></script>
    <script src="ui-icons.js"></script>
    <script src="park-data.js"></script>
    <script src="places.js"></script>
    <script src="park-search.js"></script>
    <script src="profiles.js"></script>
    <script src="boards.js"></script>
    <script src="script.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="visitor.js"></script>
    <script src="pets.js"></script>
    <script src="auth.js"></script>
    <script src="pwa.js"></script>
  </body>
</html>
